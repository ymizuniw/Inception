services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    env_file: .env
    secrets:
      - source: db_password
      - target: db_password.txt
      - source: db_root_password
      - target: db_root_password.txt
    volumes:
      - wp_data:/var/lib/mysql
    networks:
      - wp_network
    restart: on-failure

  wordpress:
    build:

